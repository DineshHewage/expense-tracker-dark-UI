<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <div class="main-container">
      <h1>Expense Tracker</h1>
      <form id="expense-form">
        <input
          type="text"
          id="expense-name"
          placeholder="Expense name"
          required
        />
        <input
          type="number"
          id="expense-amount"
          placeholder="Amount"
          required
        />
        <button type="submit" id="add-expense-btn">Add Expense</button>
        <button type="submit" class="hidden" id="update-expense-btn">
          Update Expense
        </button>
        <button type="button" class="hidden" id="cancel-btn">Cancel</button>
      </form>

      <h2>Expenses</h2>

      <ul id="expense-list">
        <!--Expensers will be added dynamically-->
      </ul>

      <div id="total">
        <h3>Total : Rs <span id="total-amount">0.00</span></h3>
      </div>
    </div>
  </body>
</html>
